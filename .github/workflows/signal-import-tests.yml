name: Tests import Signal
on:
  push:
    branches: [feature/import-signal-json-media-20261110]
  pull_request:

jobs:
  test-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install tzdata
      - run: python -m py_compile export_conversation_bulles.py signal_json_import.py
      - run: python -m unittest discover -s tests -v
